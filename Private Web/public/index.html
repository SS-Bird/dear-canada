<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narrating Canada Notebook</title>
<meta name="description" content="Private working notes for the Narrating Canada project: HC and LO applications.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<div id="app">
  <aside id="nav" aria-label="Site navigation">
    <div class="navTop">
      <button id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <a href="#/" class="brand">
        <span class="brandTitle">Narrating Canada</span>
        <span class="brandSub">Working notebook · private</span>
      </a>
    </div>
    <div id="navBody">
      <section class="navSec">
        <h2 class="navHead">HC &amp; LO applications</h2>
        <a href="#/network" data-route="network">Network</a>
        <a href="#/export" data-route="export">Export</a>
      </section>
      <section class="navSec">
        <h2 class="navHead">Sources</h2>
        <a href="#/references" data-route="references">Reference bank</a>
      </section>
      <section class="navSec">
        <h2 class="navHead">Compiled assignment</h2>
        <a href="#/assignment" data-route="assignment">Whole assignment</a>
        <div id="secLinks"></div>
        <button id="addSection" class="navBtn">+ Add section</button>
      </section>
      <section class="navSec">
        <h2 class="navHead">Writing font</h2>
        <select id="fontPick" aria-label="Writing font">
          <option value="times">Times New Roman</option>
          <option value="arial">Arial</option>
          <option value="dyslexic">OpenDyslexic (dyslexia-friendly)</option>
        </select>
      </section>
      <section class="navSec">
        <div class="navNote" id="saveStatus">Loading…</div>
      </section>
    </div>
  </aside>

  <main id="center">
    <div id="stage"></div>
    <div id="page" hidden><article id="pageInner"></article></div>
  </main>

  <aside id="right" aria-label="Node editor" hidden>
    <div class="rightHead">
      <div>
        <h2 id="rightTitle"></h2>
        <div id="rightSub"></div>
      </div>
      <button id="rightStar" class="iconBtn" aria-label="Star this node" aria-pressed="false">☆</button>
      <button id="rightWide" class="iconBtn" aria-label="Widen the editor">⇤</button>
      <button id="rightClose" class="iconBtn" aria-label="Close editor">✕</button>
    </div>
    <div id="rightBody"></div>
  </aside>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
